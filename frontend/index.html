    <title>PhysTech 2026 — Biomechanics Analyzer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e2e8f0; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #1a1a2e; }
      ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- MediaPipe Pose - Local files configuration -->
    <script>
      // Override location pathname BEFORE loading MediaPipe scripts
      // This ensures MediaPipe loads files from our local directory
      window.mediaPipeBase = '/phystech/mediapipe/';
      
      // Create a fake pathname so MediaPipe thinks files are relative to /phystech/mediapipe/
      // We do this by overriding the pathname getter temporarily
      (function() {
        const originalDescriptor = Object.getOwnPropertyDescriptor(window.location, 'pathname');
        if (originalDescriptor && originalDescriptor.configurable) {
          let overridden = false;
          Object.defineProperty(window.location, 'pathname', {
            get: function() {
              if (overridden) {
                return originalDescriptor.get.call(window.location);
              }
              return '/phystech/mediapipe/dummy.html';
            },
            configurable: true
          });
          
          // After scripts load, restore original
          window.addEventListener('load', function() {
            Object.defineProperty(window.location, 'pathname', originalDescriptor);
          }, { once: true });
        }
      })();
      
      console.log('MediaPipe configured to load from:', window.mediaPipeBase);
    </script>
    <script src="/phystech/mediapipe/camera_utils.js"></script>
    <script src="/phystech/mediapipe/drawing_utils.js"></script>
    <script src="/phystech/mediapipe/pose.js"></script>
    <script>
      window.addEventListener('load', () => {
        if (window.Pose) {
          console.log('✅ MediaPipe Pose loaded successfully (local)');
        } else {
          console.error('❌ MediaPipe Pose failed to load! Check /phystech/mediapipe/');
        }
        if (window.Camera) {
          console.log('✅ MediaPipe Camera loaded successfully');
        } else {
          console.error('❌ MediaPipe Camera failed to load!');
        }
      });
    </script>
    <script type="module" src="/phystech/assets/index-DJezZ43g.js"></script>
  </body>
